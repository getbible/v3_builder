name: "getBibleSword"

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/native-smoke.yml"
      - "scripts/install_getbiblesword.py"
      - "src/**"
      - "tests_integration/**"
      - "conf/CrosswireModulesMapTest.json"
      - "requirements*.txt"
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-getbiblesword-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: "Public release + real SWORD modules"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Install public GetBibleSWORD release
        run: |
          python scripts/install_getbiblesword.py
          .tools/getbiblesword version
          .tools/getbiblesword contract
          python -m json.tool .tools/getbiblesword-release.json

      - name: Build and validate real modules
        env:
          GETBIBLESWORD_BIN: ${{ github.workspace }}/.tools/getbiblesword
        run: >-
          python -m pytest tests_integration/ -v --tb=short
          --run-integration --integration-seed=20260718
