name: "Active!"

on:
  # Run every Thursday at 02:22
  schedule:
    - cron: '22 2 * * THU'

  # Allow manual execution from any branch
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup gitHub User Details
        uses: octoleo/git-user@v2
        with:
          gpg-key: ${{ secrets.GETBIBLE_GPG_KEY }}
          gpg-user: ${{ secrets.GETBIBLE_GPG_USER }}
          ssh-key: ${{ secrets.GETBIBLE_SSH_KEY }}
          ssh-pub: ${{ secrets.GETBIBLE_SSH_PUB }}
          git-user: ${{ secrets.GETBIBLE_GIT_USER }}
          git-email: ${{ secrets.GETBIBLE_GIT_EMAIL }}

      - name: Set Active
        run: |
          python3 src/builder.py --set-active
