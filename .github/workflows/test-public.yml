name: "Public Domain Bible API build"

on:
  # Allow manual execution from any branch
  workflow_dispatch:
    inputs:
      allow_output_growth:
        description: "Allow reviewed JSON growth above 25% for this publication only"
        required: false
        default: false
        type: boolean

concurrency:
  group: getbible-v3-test-publication
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install latest stable GetBibleSWORD release
        run: |
          python3 scripts/install_getbiblesword.py
          .tools/getbiblesword version
          python3 -m json.tool .tools/getbiblesword-release.json

      - name: Setup gitHub User Details
        uses: octoleo/git-user@v2
        with:
          gpg-key: ${{ secrets.GETBIBLE_GPG_KEY }}
          gpg-user: ${{ secrets.GETBIBLE_GPG_USER }}
          ssh-key: ${{ secrets.GETBIBLE_SSH_KEY }}
          ssh-pub: ${{ secrets.GETBIBLE_SSH_PUB }}
          git-user: ${{ secrets.GETBIBLE_GIT_USER }}
          git-email: ${{ secrets.GETBIBLE_GIT_EMAIL }}

      - name: Build the JSON Bible files
        env:
          GETBIBLESWORD_BIN: ${{ github.workspace }}/.tools/getbiblesword
          HASH_REPO: ${{ secrets.GETBIBLE_HASH_REPO_T }}
          SCRIPTURE_REPO: ${{ secrets.GETBIBLE_SCRIPTURE_REPO_T }}
          ALLOW_OUTPUT_GROWTH: ${{ inputs.allow_output_growth || false }}
        run: |
          args=(
            --pull
            --repo-hash="$HASH_REPO"
            --repo-scripture="$SCRIPTURE_REPO"
            --bconf="conf/PublicDomainBibles.json"
          )
          if [[ "$ALLOW_OUTPUT_GROWTH" == "true" ]]; then
            args+=(--allow-output-growth)
          fi
          python3 src/builder.py "${args[@]}"
