name: "Build getBible static JSON API files"

on:
  # Run once per month on the 1st at 04:12
  schedule:
    - cron: '12 4 1 * *'

  # Allow manual execution from any branch
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup gitHub User Details
        uses: octoleo/git-user@v2
        with:
          gpg-key: ${{ secrets.GETBIBLE_GPG_KEY }}
          gpg-user: ${{ secrets.GETBIBLE_GPG_USER }}
          ssh-key: ${{ secrets.GETBIBLE_SSH_KEY }}
          ssh-pub: ${{ secrets.GETBIBLE_SSH_PUB }}
          git-user: ${{ secrets.GETBIBLE_GIT_USER }}
          git-email: ${{ secrets.GETBIBLE_GIT_EMAIL }}

      - name: Build the JSON Bible files
        env:
          HASH_REPO: ${{ secrets.GETBIBLE_HASH_REPO }}
          SCRIPTURE_REPO: ${{ secrets.GETBIBLE_SCRIPTURE_REPO }}
        run: |
          python3 src/builder.py --pull --push \
            --repo-hash="$HASH_REPO" \
            --repo-scripture="$SCRIPTURE_REPO"

