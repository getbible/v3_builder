name: "Unit Tests"

on:
  push:
    branches:
      - master
      - "agent/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      run_integration:
        description: "Run native integration tests with real SWORD modules"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  unit:
    name: "Unit Tests (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run Unit Tests
        run: python -m pytest tests/ -v --tb=short

  integration:
    name: "Native Integration Tests"
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_integration == 'true'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Install policy-selected GetBibleSWORD release
        run: |
          python scripts/install_getbiblesword.py
          echo "$PWD/.tools" >> "$GITHUB_PATH"
          .tools/getbiblesword version
          python -m json.tool .tools/getbiblesword-release.json
      - name: Run Integration Tests
        env:
          GETBIBLESWORD_BIN: ${{ github.workspace }}/.tools/getbiblesword
        run: python -m pytest tests_integration/ -v --tb=short --run-integration
