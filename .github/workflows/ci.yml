name: "Run Bible Unit Tests"

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

  # Allow manual execution from any branch
  workflow_dispatch:
    inputs:
      run_integration:
        description: "Run integration tests (downloads real SWORD modules)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  unit:
    name: "Unit Tests (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Unit Tests
        run: |
          python -m pytest tests/ -v --tb=short

  integration:
    name: "Integration Tests"
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_integration == 'true'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Integration Tests
        run: |
          python -m pytest tests_integration/ -v --tb=short --run-integration
